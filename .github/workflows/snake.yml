name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Imran1309
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=gold
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=gold&color_dots=#161b22,#505050,#888888,#bbbbbb,#ffffff
      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
