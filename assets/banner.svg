<svg width="1440" height="420" viewBox="0 0 1440 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Imran — developer profile banner</title>
  <desc id="desc">A dark blue neon banner with code-inspired lines and a greeting.</desc>
  <defs>
    <linearGradient id="background" x1="30" y1="20" x2="1410" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B1B"/>
      <stop offset="0.5" stop-color="#0B1F42"/>
      <stop offset="1" stop-color="#071126"/>
    </linearGradient>
    <linearGradient id="neon" x1="245" y1="80" x2="1130" y2="337" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#38BDF8" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1440" height="420" rx="22" fill="url(#background)"/>
  <rect width="1440" height="420" rx="22" fill="url(#grid)"/>
  <circle cx="1218" cy="76" r="148" fill="#0EA5E9" fill-opacity=".13"/>
  <circle cx="1328" cy="330" r="220" fill="#6366F1" fill-opacity=".11"/>
  <path d="M0 300C170 190 235 405 437 298C629 196 699 137 856 216C1012 294 1127 118 1440 172" stroke="url(#neon)" stroke-width="2" stroke-opacity=".75" filter="url(#glow)"/>
  <path d="M890 68H1245M1070 68V126M1190 68V101M970 352H1310M1260 295V352M1135 321V352" stroke="#22D3EE" stroke-width="2" stroke-opacity=".6"/>
